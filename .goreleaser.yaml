version: 2

builds:
  - main: ./cmd
    binary: indexing-service
    ldflags:
      # Every -X names a variable that exists in pkg/build: the linker accepts a
      # -X for a symbol that does not exist WITHOUT any diagnostic, so a flag
      # pointing at the wrong package is a silent no-op, not a build failure.
      # Date is {{.CommitDate}} rather than the build time so the checksums are
      # reproducible. See https://goreleaser.com/customization/builds/#reproducible-builds.
      - -s -w -X github.com/fil-forge/indexing-service/pkg/build.version=v{{.Version}} -X github.com/fil-forge/indexing-service/pkg/build.Commit={{.Commit}} -X github.com/fil-forge/indexing-service/pkg/build.Date={{.CommitDate}} -X github.com/fil-forge/indexing-service/pkg/build.BuiltBy=goreleaser
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - 'amd64'
      - 'arm64'
    # Change to a static date for checksum verification. See https://goreleaser.com/customization/builds/#reproducible-builds.
    mod_timestamp: '{{.CommitTimestamp}}'
    env:
      - CGO_ENABLED=0
universal_binaries:
  - replace: true
archives:
  - format_overrides:
    - goos: windows
      format: zip
    - goos: darwin
      format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}mac_os
      {{- else }}{{ .Os }}{{ end }}_{{ .Arch }}
release:
  mode: keep-existing
changelog:
  disable: true
